name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 1 * * 1'

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate synthetic evidence
        run: python -m thermal_validation demo --root .
      - name: Regenerate paired common-mode comparison
        run: python -m thermal_validation common-mode --root .
      - name: Verify committed evidence is reproducible
        run: git diff --exit-code -- data/synthetic results
